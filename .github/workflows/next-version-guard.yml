name: next-version-guard
# Stand 2026-09-16: Schwelle 16.3.3 (16er) bzw. 15.5.24 (15er), GHSA-2xp9-vwfh-vxw4 (RCE ueber /_next/image bei AVIF).
# Sicherheits-Gate: blockt verwundbare Next.js-Versionen (Server-Actions-RCE < 15.4.11).
# Hintergrund: 2x Server-Kompromittierung (2026-06-03, 2026-07-01) via veraltete Next-Version.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block vulnerable Next.js versions
        run: |
          RANGE=$(node -p "const p=require('./package.json');((p.dependencies||{}).next)||((p.devDependencies||{}).next)||''")
          if [ -z "$RANGE" ]; then echo "kein next-dependency -> skip"; exit 0; fi
          VER=$(echo "$RANGE" | sed 's/[^0-9.]//g')
          echo "next deklariert: $RANGE -> $VER"
          node -e "const p='$VER'.split('.').map(Number); const bad=p[0]<=14||(p[0]===15&&(p[1]<5||(p[1]===5&&(p[2]||0)<24)))||(p[0]===16&&(p[1]<3||(p[1]===3&&(p[2]||0)<3))); if(bad){console.error('::error::SECURITY-GATE: next '+'$VER'+' ist verwundbar (GHSA-2xp9-vwfh-vxw4). Erlaubt: >=15.5.24 im 15er-Zweig, >=16.3.3 im 16er-Zweig.');process.exit(1)} console.log('OK: next '+'$VER'+' ist gepatcht')"
