# Dokploy-Deployment-Spec für Hetzner-VPS.
# Domain wird zur Build-Zeit gesetzt (Cloudflare-Proxy + Hetzner-Origin).

appName: client-kitesurfing-dakhla
buildType: dockerfile
dockerfile: ./Dockerfile

domain: kitesurfingdakhla.com
aliases:
  - www.kitesurfingdakhla.com

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'

healthCheck:
  path: /api/health
  interval: 30s
  timeout: 5s
  retries: 3

resources:
  cpu: '1'
  memory: 1G

restart: unless-stopped
